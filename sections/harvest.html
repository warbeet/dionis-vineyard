<section id="harvest" class="section">
  <h2>🍷 Урожай и Винодельня</h2>
  
  <!-- Вкладки: Сбор | Затраты | Винодельня -->
  <div class="modal-tabs" style="margin-bottom:15px;">
    <button class="modal-tab active" onclick="switchHarvestTab('harvest-input', this)">🍇 Сбор</button>
    <button class="modal-tab" onclick="switchHarvestTab('costs-input', this)">💰 Затраты</button>
    <button class="modal-tab" onclick="switchHarvestTab('winery-tab', this)">🍷 Винодельня</button>
  </div>
  
  <!-- Вкладка: Сбор -->
  <div id="harvest-input" class="harvest-tab-content">
    <div class="grid grid-2">
      <div class="card">
        <h3>Запись партии урожая</h3>
        <div class="form-row"><label>Дата сбора</label><input type="date" id="h-date"></div>
        <div class="form-grid">
          <div class="form-row"><label>Участок</label><select id="h-plot"></select></div>
          <div class="form-row"><label>Сорт / Блок</label><select id="h-variety"></select></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>№ партии</label><input type="text" id="h-batch" placeholder="2026-Сира-01"></div>
          <div class="form-row"><label>Вес, кг</label><input type="number" id="h-weight" step="0.1"></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>Brix (°)</label><input type="number" id="h-brix" step="0.1" placeholder="22.5"></div>
          <div class="form-row"><label>Кислотн. (г/л)</label><input type="number" id="h-acid" step="0.1" placeholder="6.8"></div>
          <div class="form-row"><label>pH</label><input type="number" id="h-ph" step="0.01" placeholder="3.45"></div>
          <div class="form-row"><label>Температура ягод (°C)</label><input type="number" id="h-temp" step="0.1" placeholder="18.5"></div>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label>Тара</label>
            <select id="h-container">
              <option value="box_20kg">Ящик 20 кг</option>
              <option value="box_25kg">Ящик 25 кг</option>
              <option value="bin_300kg">Бин 300 кг</option>
              <option value="bin_500kg">Бин 500 кг</option>
              <option value="trailer">Прицеп</option>
              <option value="other">Другое</option>
            </select>
          </div>
          <div class="form-row"><label>Кол-во тары</label><input type="number" id="h-container-count" step="1" placeholder="15"></div>
        </div>
        <div class="form-grid">
          <div class="form-row"><label>Брак (%)</label><input type="number" id="h-botrytis" step="0.1" placeholder="2.5" title="Процент серой гнили и повреждённых ягод"></div>
          <div class="form-row"><label>Фитосанитарное состояние</label>
            <select id="h-health">
              <option value="excellent">Отличное</option>
              <option value="good">Хорошее</option>
              <option value="fair">Удовлетворительное</option>
              <option value="poor">Плохое</option>
            </select>
          </div>
        </div>
        <div class="form-row"><label>Заметки</label><textarea id="h-notes" rows="2" placeholder="Особенности партии, комментарии..."></textarea></div>
        <button class="btn" onclick="saveHarvest()">💾 Сохранить партию</button>
      </div>
      <div class="card">
        <h3>Сводка по урожаю</h3>
        <div style="margin-bottom:10px;">
          <button class="btn small" onclick="renderHarvestByPlot()">По участкам</button>
          <button class="btn small" onclick="renderHarvestByVariety()">По сортам</button>
          <button class="btn small" onclick="exportHarvestCSV()">📥 Экспорт CSV</button>
        </div>
        <div id="harvest-summary" class="table-wrap"></div>
      </div>
    </div>
  </div>
  
  <!-- Вкладка: Затраты -->
  <div id="costs-input" class="harvest-tab-content" style="display:none;">
    <div class="grid grid-2">
      <div class="card">
        <h3>Запись затрат</h3>
        <div class="form-row"><label>Дата</label><input type="date" id="c-date"></div>
        <div class="form-row">
          <label>Категория</label>
          <select id="c-cat">
            <option>Препараты</option><option>Удобрения</option><option>Топливо</option>
            <option>Зарплата</option><option>Оборудование</option><option>Тара</option>
            <option>Налоги/услуги</option><option>Другое</option>
          </select>
        </div>
        <div class="form-row"><label>Описание</label><input type="text" id="c-desc"></div>
        <div class="form-row"><label>Сумма</label><input type="number" id="c-amount" step="0.01"></div>
        <button class="btn" onclick="saveCost()">💾 Сохранить</button>
      </div>
      <div class="card">
        <h3>Сводка по затратам</h3>
        <div id="costs-summary" class="table-wrap"></div>
      </div>
    </div>
  </div>
  
  <!-- Вкладка: Винодельня -->
  <div id="winery-tab" class="harvest-tab-content" style="display:none;">
    <div class="card">
      <h3>🍷 Брожение и выдержка</h3>
      <p style="font-size:13px; color:#8a7a6a; margin-bottom:15px;">Партии первичного виноделия: от приёмки винограда до выдержки в дубе и стали.</p>
      <div id="winery-container"></div>
    </div>
  </div>
</section>

<script>
function switchHarvestTab(tabId, btn) {
  // Скрыть все вкладки
  document.querySelectorAll('.harvest-tab-content').forEach(el => el.style.display = 'none');
  document.querySelectorAll('.modal-tabs .modal-tab').forEach(b => b.classList.remove('active'));
  
  // Показать нужную
  document.getElementById(tabId).style.display = 'block';
  if (btn) btn.classList.add('active');
  
  // Рендер winery при переключении на вкладку
  if (tabId === 'winery-tab' && typeof renderWinery === 'function') {
    renderWinery();
  }
}
</script>
